<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>找到第一个球 · Pixel Breakout v4</title>
<style>
  :root{
    --bg:#0f0e17; --panel:#1a1930; --ink:#fffffe; --dim:#a7a9be;
    --accent:#ff8906; --neon:#7f5af0; --green:#2cb67d; --pink:#e53170;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Courier New',monospace;
    display:flex;flex-direction:column;align-items:center;
    user-select:none;-webkit-user-select:none;touch-action:none;
  }
  .hud{
    width:min(560px,100vw);display:flex;justify-content:space-between;align-items:center;
    padding:12px 16px 6px;font-size:13px;letter-spacing:1px;flex-wrap:wrap;gap:2px 8px;
  }
  .hud b{color:var(--accent);}
  .hud .score{font-size:15px;}
  .hud .balls{color:var(--neon);}
  .hud .queue{color:#00d4ff;}
  .hud .lives{color:var(--pink);}
  .stage{
    position:relative;
    width:min(560px,100vw);
    aspect-ratio:14/20;
    background:var(--panel);
    border:2px solid #2a2840;
    border-radius:8px;
    overflow:hidden;
    box-shadow:0 0 24px rgba(127,90,240,.15), inset 0 0 40px rgba(0,0,0,.4);
  }
  canvas{
    display:block;width:100%;height:100%;
    image-rendering:pixelated;image-rendering:crisp-edges;
    background:#14132a;
  }
  .overlay{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;
    background:rgba(15,14,23,.85);backdrop-filter:blur(3px);
    text-align:center;z-index:5;
  }
  .overlay.hidden{display:none;}
  /* 结算页：半透明背景，让连锁碎裂粒子透出来 */
  #settleOverlay{background:rgba(15,14,23,.55);backdrop-filter:none;}
  .overlay h1{
    font-size:30px;letter-spacing:2px;color:var(--accent);
    text-shadow:0 0 18px rgba(255,137,6,.6);
  }
  .overlay h1 .px{color:var(--neon);}
  .overlay p{color:var(--dim);font-size:13px;line-height:1.8;padding:0 24px;}
  .overlay .tip{color:var(--green);font-size:12px;}
  .btn{
    margin-top:6px;padding:12px 34px;font-size:17px;font-family:inherit;letter-spacing:2px;
    background:var(--accent);color:#0f0e17;border:none;border-radius:6px;
    cursor:pointer;font-weight:700;
    box-shadow:0 0 0 2px #0f0e17,0 0 0 4px var(--accent);
  }
  .btn:active{transform:translateY(2px);}
  .btn.ghost{background:transparent;color:var(--ink);box-shadow:0 0 0 2px #2a2840;}
  /* v3-13 下一关按钮脉冲光效 */
  .btn.pulse{animation:pulseGlow 1.1s ease-in-out infinite;}
  @keyframes pulseGlow{
    0%,100%{box-shadow:0 0 0 2px #0f0e17,0 0 0 4px var(--accent),0 0 14px var(--accent);}
    50%{box-shadow:0 0 0 2px #0f0e17,0 0 0 7px var(--accent),0 0 36px var(--accent);}
  }
  /* v3-13 星级弹出动画 */
  #settleStars{font-size:30px;letter-spacing:8px;color:var(--accent);opacity:0;
    animation:starPop .55s .75s forwards;text-shadow:0 0 16px rgba(255,137,6,.8);}
  @keyframes starPop{from{opacity:0;transform:scale(2.2) rotate(-12deg);}to{opacity:1;transform:scale(1) rotate(0);}}
  .controls{width:min(560px,100vw);display:flex;gap:8px;padding:8px 12px 10px;justify-content:center;}
  .pad-btn{
    flex:1;max-width:160px;padding:10px 0;font-size:18px;font-family:inherit;
    background:#1a1930;color:var(--ink);border:2px solid #2a2840;border-radius:8px;
    cursor:pointer;touch-action:none;
  }
  .pad-btn:active{background:#2a2840;}
  .pad-btn.hide-desk{display:none;}
  @media (pointer:coarse){ .pad-btn{display:block;} }
  .mute{position:absolute;top:8px;right:10px;background:none;border:none;color:var(--dim);font-size:16px;cursor:pointer;z-index:6;}
</style>
</head>
<body>
  <div class="hud">
    <span class="score">SCORE <b id="score">0</b></span>
    <span>LEVEL <b id="level">1</b></span>
    <span class="balls">⚪<b id="ballCnt">1</b></span>
    <span class="queue">▸<b id="queueCnt">3</b></span>
    <span class="lives" id="lives">♥♥♥</span>
  </div>
  <div class="stage" id="stage">
    <canvas id="game" width="280" height="400"></canvas>
    <button class="mute" id="muteBtn" title="声音">🔊</button>
    <div class="overlay" id="startOverlay">
      <h1><span class="px">找</span>到第一个球</h1>
      <p>抖音爆火解压打砖块 · 像素复刻版 v4<br>15 个预设关卡 · 灰墙挡路，找缺口攻入<br>砖块数字 = 血量，归零才碎 · 按住蓄力 → 松手齐射</p>
      <p class="tip">👆 按住蓄力瞄准 · 松手齐射 ｜ 松开后拖拽挡板 ｜ ◀ ▶ 键盘 / 空格齐射</p>
      <button class="btn" id="startBtn">开始 ▶</button>
    </div>
    <div class="overlay hidden" id="winOverlay">
      <h1>🎉 通关！</h1>
      <p>最终得分 <b id="finalScore" style="color:var(--accent)">0</b></p>
      <button class="btn" id="againBtn">再来一局</button>
    </div>
    <div class="overlay hidden" id="settleOverlay">
      <h1 id="settleTitle" style="color:var(--green)">LEVEL CLEAR!</h1>
      <div id="settleStars">★★★</div>
      <p>得分 <b id="settleScore" style="color:var(--accent);font-size:24px">0</b></p>
      <button class="btn pulse" id="nextBtn">下一关 ▶</button>
    </div>
    <div class="overlay hidden" id="overOverlay">
      <h1 style="color:var(--neon)">游戏结束</h1>
      <p>得分 <b id="overScore" style="color:var(--accent)">0</b> · 关卡 <b id="overLevel" style="color:var(--green)">1</b></p>
      <button class="btn" id="retryBtn">重新开始</button>
    </div>
  </div>
  <div class="controls">
    <button class="pad-btn hide-desk" id="leftBtn">◀</button>
    <button class="pad-btn hide-desk" id="rightBtn">▶</button>
  </div>

<script>
(() => {
  'use strict';
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const stage = document.getElementById('stage');

  // ---- 8-bit 音效 ----
  let muted = false;
  const muteBtn = document.getElementById('muteBtn');
  muteBtn.onclick = () => { muted=!muted; muteBtn.textContent = muted?'🔇':'🔊'; };
  let actx = null;
  function ac(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(actx && actx.state==='suspended') actx.resume(); return actx; }
  function tone(f, d, v, type='square', slide=0){
    if(muted) return;
    const a = ac(); if(!a) return;
    const o=a.createOscillator(), g=a.createGain();
    o.type=type; o.frequency.value=f;
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide), a.currentTime+d);
    o.connect(g); g.connect(a.destination);
    g.gain.value=v; g.gain.exponentialRampToValueAtTime(.0001, a.currentTime+d);
    o.start(); o.stop(a.currentTime+d);
  }
  // v3-3 连击音阶：C D E F G A B C' 八音循环
  const SCALE = [261.6, 293.7, 329.6, 349.2, 392.0, 440.0, 493.9, 523.3];
  const NOTE_COLORS = ['#ff8906','#ffb703','#7f5af0','#2cb67d','#e53170','#00d4ff','#fffffe','#ffd700'];
  const S = {
    wall:  ()=>tone(340,.05,.05,'square',-60),
    paddle:()=>tone(700,.06,.06,'square',120),
    hit:   ()=>{ const n=SCALE[(Math.max(0,combo-1))%8]; tone(n,.06,.05,'square',60); }, // v3-3 音阶随连击升高
    destroy:()=>tone(170,.09,.07,'square',-60),  // v3-1 血量归零闷响
    split: ()=>tone(1200,.12,.07,'square',-700),
    catch: ()=>tone(880,.08,.06,'square',300),
    power: ()=>tone(1400,.15,.07,'square',-900),
    fire:  ()=>{ tone(500,.07,.05,'square',400); setTimeout(()=>tone(750,.09,.05,'square',500),60); }, // v3-2 齐射
    refill:()=>tone(520,.06,.04,'square',200),   // v3-2 落地球回填待发
    clear: ()=>{ [523,587,659,784,880,1047,1175,1319].forEach((f,i)=>setTimeout(()=>tone(f,.12,.06),i*70)); }, // v3-8 清屏音阶高潮
    settle:()=>{ [392,523,659,784].forEach((f,i)=>setTimeout(()=>tone(f,.15,.06,'square',80),i*110)); },        // v3-13 结算
    triple:()=>{ tone(659,.08,.06); setTimeout(()=>tone(880,.12,.06),80); }, // v3-10 TRIPLE
    mega:  ()=>{ [523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>tone(f,.1,.06),i*60)); },               // v3-10 MEGA
    save:  ()=>{ tone(880,.05,.05,'square',-300); setTimeout(()=>tone(660,.06,.05),50); },                    // v3-10 SAVE
    lose:  ()=>{ tone(400,.3,.07,'sawtooth',-200); setTimeout(()=>tone(200,.4,.06,'sawtooth',-100),150); },
    level: ()=>{ tone(660,.1,.06); setTimeout(()=>tone(880,.1,.06),110); setTimeout(()=>tone(1320,.2,.07),220); }
  };

  // ---- 像素文字 ----
  const PX_FONT = '"Courier New",monospace';
  function pxText(t,x,y,size,color,align='center'){
    ctx.font = `${size}px ${PX_FONT}`;
    ctx.textAlign = align; ctx.textBaseline='middle';
    ctx.fillStyle = color;
    ctx.fillText(t,x,y);
  }

  // ---- 常量 ----
  const BRICK_H = 13, BRICK_TOP = 40;              // v4 砖高固定，砖宽随列数动态计算
  const BRICK_COLORS = ['#ff8906','#ffb703','#7f5af0','#2cb67d','#e53170','#00d4ff'];
  const DROP_RATE = 0.22;      // 砖块掉落道具概率
  const BALL_MAX = 24;         // 小球上限（防卡顿）
  const QUEUE_MAX = 8;         // v4 待发球上限（后期关卡 6 球起步）
  const FIRE_SPREAD = 0.35;    // v3-2 齐射扇面弧度

  // ================= v4 关卡表：15 个预设关卡（替代 v3 无尽随机） =================
  // 字段：rows 行数 | cols 列数 | pattern 砖块布局 | wallPattern 围墙模式
  //       hpMin/hpMax 砖块血量范围 | speedMult 球速倍率 | queue 待发球数 | note 设计意图
  // 围墙模式：0 无墙 / 1 两侧柱 / 2 中间柱 / 3 阶梯墙 / 4 U形墙 / 5 迷宫墙 / 6 L形墙 / 7 双柱横梁
  // 难度曲线：前 3 关简单教学 → 4-8 关中量 → 9-15 高难（厚血 + 密墙），15 关通关后循环（球速封顶）
  const LEVELS = [
    {rows:5,  cols:8,  pattern:'full',    wallPattern:0, hpMin:1, hpMax:1, speedMult:1.00, queue:3, note:'教学关：整墙满铺，一碰就碎'},
    {rows:6,  cols:8,  pattern:'full',    wallPattern:0, hpMin:1, hpMax:1, speedMult:1.05, queue:3, note:'加行提速，熟悉手感'},
    {rows:6,  cols:9,  pattern:'full',    wallPattern:1, hpMin:1, hpMax:2, speedMult:1.10, queue:3, note:'首次见墙：两侧立柱'},
    {rows:7,  cols:9,  pattern:'checker', wallPattern:0, hpMin:1, hpMax:2, speedMult:1.15, queue:3, note:'棋盘格，隔行敲击'},
    {rows:7,  cols:10, pattern:'full',    wallPattern:2, hpMin:1, hpMax:2, speedMult:1.20, queue:4, note:'中间柱：绕柱击砖'},
    {rows:8,  cols:10, pattern:'stepsL',  wallPattern:1, hpMin:2, hpMax:2, speedMult:1.25, queue:4, note:'阶梯砖 + 两侧墙'},
    {rows:8,  cols:11, pattern:'frame',   wallPattern:3, hpMin:2, hpMax:2, speedMult:1.30, queue:4, note:'阶梯墙分割战场'},
    {rows:9,  cols:11, pattern:'wedge',   wallPattern:4, hpMin:2, hpMax:2, speedMult:1.35, queue:4, note:'U形墙围砖，缺口攻入'},
    {rows:9,  cols:12, pattern:'full',    wallPattern:5, hpMin:2, hpMax:3, speedMult:1.40, queue:5, note:'迷宫墙，绕路击砖'},
    {rows:10, cols:12, pattern:'checker', wallPattern:7, hpMin:2, hpMax:3, speedMult:1.45, queue:5, note:'双柱横梁，上下夹击'},
    {rows:10, cols:12, pattern:'center',  wallPattern:6, hpMin:3, hpMax:3, speedMult:1.50, queue:5, note:'L形墙困住中央厚血砖'},
    {rows:10, cols:12, pattern:'full',    wallPattern:5, hpMin:3, hpMax:3, speedMult:1.55, queue:5, note:'迷宫 + 全厚血'},
    {rows:10, cols:12, pattern:'wedge',   wallPattern:4, hpMin:3, hpMax:4, speedMult:1.60, queue:6, note:'U形墙 + 厚血拆墙战'},
    {rows:10, cols:12, pattern:'stepsR',  wallPattern:2, hpMin:3, hpMax:4, speedMult:1.65, queue:6, note:'中间柱 + 4血砖'},
    {rows:10, cols:12, pattern:'full',    wallPattern:5, hpMin:3, hpMax:4, speedMult:1.70, queue:6, note:'最终关：迷宫 + 厚血 + 满铺'},
  ];
  const WALL_CAP = 1.7;        // v4 循环模式难度封顶：球速不超过最终关

  // 砖块布局模式：返回 (r,c) 处是否有砖
  function brickCell(p, r, c, rows, cols){
    switch(p){
      case 'checker': return (r+c)%2===0;                                  // 棋盘格
      case 'frame':   return r===0||r===rows-1||c===0||c===cols-1;         // 边框
      case 'stepsL':  return c>=r;                                         // 左下阶梯
      case 'stepsR':  return c<=cols-1-r;                                  // 右下阶梯
      case 'wedge':   return c>=Math.floor(cols*r/rows);                   // 楔形
      case 'center':  return c>=Math.floor(cols/4)&&c<cols-Math.floor(cols/4)&&r>=Math.floor(rows/4)&&r<rows-Math.floor(rows/4); // 中央方块
      default:        return true;                                         // full 满铺
    }
  }

  // v4 围墙布局：返回 {cells:墙格子[], gaps:缺口格子[]}（格子用 {r,c} 行列表示）
  // 缺口格子 = 无砖无墙的通道，球必须从缺口进出被围住的区域
  function wallCells(mode, rows, cols){
    const cells=[], gaps=[];
    const add=(r,c)=>{ if(r>=0&&r<rows&&c>=0&&c<cols) cells.push({r,c}); };
    const gap=(r,c)=>{ if(r>=0&&r<rows&&c>=0&&c<cols) gaps.push({r,c}); };
    switch(mode){
      case 0: break;                                   // 0 无墙
      case 1:                                          // 1 两侧立柱：左右各一列短墙
        for(let r=1;r<=rows-3;r++){ add(r,0); add(r,cols-1); }
        break;
      case 2: {                                        // 2 中间柱：中央垂直柱，底部留缺口
        const mid=Math.floor(cols/2);
        for(let r=0;r<=rows-2;r++) add(r,mid);
        gap(rows-1,mid); gap(rows-1,mid-1); gap(rows-1,mid+1);
        break; }
      case 3: {                                        // 3 阶梯墙：斜向阶梯，两端留空 + 中部缺口（防密封死区）
        for(let c=0;c<cols;c++){ const r=rows-2-Math.floor(c/2); if(r>=1) add(r,c); }
        gap(0,0); gap(rows-1,cols-1);
        const mc=Math.floor(cols/2);                   // 中部缺口：让球能穿越对角线两侧
        gap(rows-2-Math.floor(mc/2), mc);
        break; }
      case 4: {                                        // 4 U形墙：两侧竖墙 + 顶部横梁，开口朝下
        for(let r=0;r<=rows-2;r++){ add(r,1); add(r,cols-2); }
        for(let c=1;c<=cols-2;c++) add(0,c);
        for(let c=1;c<=cols-2;c++) gap(rows-1,c);
        break; }
      case 5: {                                        // 5 迷宫墙：上横/中竖/下横三段交错，各留缺口
        for(let c=0;c<cols;c++){ if(c<2||c>3) add(2,c); }
        for(let r=3;r<=6;r++){ if(r!==4) add(r,5); }
        for(let c=0;c<cols;c++){ if(c<9||c>10) add(6,c); }
        gap(2,2); gap(2,3); gap(4,5); gap(6,9); gap(6,10);
        break; }
      case 6: {                                        // 6 L形墙：左竖 + 下横，右下角留缺口
        for(let r=0;r<=rows-2;r++) add(r,0);
        for(let c=0;c<=cols-3;c++) add(rows-2,c);
        gap(rows-1,cols-2); gap(rows-1,cols-1); gap(rows-2,cols-2); gap(rows-2,cols-1);
        break; }
      case 7: {                                        // 7 双柱+横梁：两立柱顶横梁，柱间底部开口
        for(let r=1;r<=rows-2;r++){ add(r,2); add(r,cols-3); }
        for(let c=2;c<=cols-3;c++) add(1,c);
        for(let c=2;c<=cols-3;c++) gap(rows-1,c);
        break; }
    }
    return {cells, gaps};
  }

  // 将墙格子合并为实心矩形（先水平合并，再垂直合并同宽相邻段，间隙填实防漏球）
  function wallRects(cells, rows, cols){
    const map={};
    for(const c of cells) map[c.r*cols+c.c]=true;
    const rects=[];
    for(let r=0;r<rows;r++){
      for(let c=0;c<cols;){
        if(!map[r*cols+c]){ c++; continue; }
        let c2=c;
        while(c2+1<cols && map[r*cols+(c2+1)]) c2++;
        rects.push({x:curLeft+c*(curBW+curGap), y:BRICK_TOP+r*(BRICK_H+curGap), w:(c2-c+1)*curBW+(c2-c)*curGap, h:BRICK_H});
        c=c2+1;
      }
    }
    const out=[];
    for(const rt of rects){
      let merged=false;
      for(const o of out){
        if(o.x===rt.x && o.w===rt.w && rt.y===o.y+o.h+curGap){  // 垂直相邻 → 合并成实心
          o.h=rt.y+rt.h-o.y; merged=true; break;
        }
      }
      if(!merged) out.push({x:rt.x,y:rt.y,w:rt.w,h:rt.h});
    }
    return out;
  }

  // v4 当前关卡定义：15 关后按 (level-1)%15 循环，循环时球速封顶（难度不再上升）
  function loopOf(){ return Math.floor((level-1)/LEVELS.length); }
  function levelDef(){
    const def = LEVELS[(level-1)%LEVELS.length];
    if(loopOf()>0) return Object.assign({}, def, {speedMult: WALL_CAP});
    return def;
  }

  // ---- 状态 ----
  let bricks=[], walls=[], balls=[], drops=[], score=0, lives=3, level=1;
  // v4 当前关卡网格参数（随关卡表动态计算）
  let curCols=8, curRows=5, curBW=29, curGap=3, curLeft=13;
  let paddle, running=false;
  let lastT=0, animId=null;
  let comboFlash=0, comboText='', comboColor='#fff';
  // v3 新增状态
  let phase='play';            // 'play' 游玩 | 'clear' 清屏慢动作 | 'settle' 结算页
  let queue=3;                 // v3-2 待发球数
  let charging=false, chargeT=0, aimAngle=0, aimX=0;   // v3-2 蓄力瞄准
  let combo=0, comboT=0, megaShown=false;              // v3-3 连击
  let particles=[], floats=[], rings=[];               // v3-4 粒子 / v3-6 飘字 / v3-9 光环
  let flash=0;                 // v3-7 全屏闪光
  let shakeState={t:0,dur:1,mag:0};                    // v3-5 屏幕震动
  let timeScale=1, clearTimer=0, clearBrickPos=[];     // v3-8 慢动作
  let chainQueue=[], chainT=0, settleRoll=null;        // v3-13 结算连锁碎裂+分数滚动
  let emaDt=1/60, particleScale=1;                     // v3-4 性能自适应
  let levelT=0, dropGuaranteed=false;                  // v3-12 开局速爽
  let destroyedLog=[], lastTriple=0, saveCd=0;         // v3-10 命名奖励
  let lastSplitT=0, cascade=1;                         // v3-7 分裂雪崩

  function brickPoints(row){ return (10+((level-1)%LEVELS.length)+1)*(curRows-row)*2; }

  // v3-1 砖块血量：随关卡递增，前 2 行低血（v3-12 开局速爽）
  // v4 按关卡表生成砖块 + 围墙：算网格 → 铺砖 → 叠墙（墙覆盖砖）→ 留缺口通道
  function buildLevel(){
    const def = levelDef();
    curCols = def.cols; curRows = def.rows;
    curGap  = curCols>=11 ? 2 : 3;                     // 密砖时缩小砖缝，砖更小更密
    curBW   = Math.floor((W-24-(curCols-1)*curGap)/curCols);
    curLeft = Math.floor((W-(curCols*curBW+(curCols-1)*curGap))/2);
    const {cells:wCells, gaps:gCells} = wallCells(def.wallPattern, curRows, curCols);
    const blocked={};
    for(const g of gCells) blocked[g.r*curCols+g.c]=true;  // 缺口：无砖无墙，球从此进出
    const wSet={};
    for(const w of wCells) wSet[w.r*curCols+w.c]=true;
    for(const k in blocked) delete wSet[k];                // v4.1 缺口格必须同时从墙中剔除，否则通道被墙堵死
    const wCellsF = wCells.filter(w=>!blocked[w.r*curCols+w.c]);
    bricks=[];
    for(let r=0;r<curRows;r++){
      for(let c=0;c<curCols;c++){
        const k=r*curCols+c;
        if(wSet[k]||blocked[k]||!brickCell(def.pattern,r,c,curRows,curCols)) continue;
        let hp;
        if(r===0) hp=1;                                // v3-12 首行必碎（开局速爽）
        else hp=Math.min(4, def.hpMin+((Math.random()*(def.hpMax-def.hpMin+1))|0)); // v4 血量随关卡表
        bricks.push({x:curLeft+c*(curBW+curGap), y:BRICK_TOP+r*(BRICK_H+curGap), w:curBW, h:BRICK_H, alive:true, row:r, hp});
      }
    }
    walls = wallRects(wCellsF, curRows, curCols);     // v4 围墙（不可破坏障碍物）
  }

  function newBall(x,y,vx,vy,r){
    return {x,y,vx,vy,r, trail:[], flash:0};
  }
  function resetBalls(){
    const sp = levelDef().speedMult;                   // v4 球速随关卡表倍率递增
    balls = [newBall(W/2, H-58, (Math.random()<.5?-1:1)*(1.8*sp), -(3.1*sp), 4)];
  }
  function resetPaddle(){
    paddle = { x:(W-56)/2, y:H-22, w:56, h:7 };
  }

  // ---- v3-5 屏幕震动 + 触感 ----
  function shake(mag,dur){ shakeState={t:dur,dur,mag}; }
  function vibrate(ms){ try{ if(navigator.vibrate) navigator.vibrate(ms); }catch(e){} }

  // ---- v3-6 分数飘字雨 ----
  function addFloat(x,y,text,color,size,life=0.7){
    if(floats.length>40) return;
    floats.push({x,y,text,color,size,life,maxLife:life});
  }

  // ---- v3-4 砖块碎裂粒子风暴 ----
  function burst(x,y,color,count){
    count = Math.round(count*particleScale);           // 性能自适应
    if(particles.length>340) return;
    for(let i=0;i<count;i++){
      const a=Math.random()*Math.PI*2, sp=20+Math.random()*70;
      particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-30,size:1.5+Math.random()*2,life:0.35+Math.random()*0.5,maxLife:0,color});
    }
  }

  function startGame(){
    score=0; lives=3; level=1;
    buildLevel(); resetPaddle(); resetBalls(); drops=[];
    queue=LEVELS[0].queue; phase='play'; timeScale=1; aimAngle=0;
    combo=0; comboT=0; megaShown=false; destroyedLog=[]; lastTriple=0; saveCd=0;
    particles=[]; floats=[]; rings=[]; chainQueue=[];
    flash=0; shakeState.t=0; lastSplitT=0; cascade=1;
    levelT=0; dropGuaranteed=false; charging=false;
    running=true;
    updateHud();
    hide('winOverlay');hide('overOverlay');hide('settleOverlay');
    lastT = performance.now();
    if(animId) cancelAnimationFrame(animId);
    animId = requestAnimationFrame(loop);
  }

  function updateHud(){
    document.getElementById('score').textContent = score;
    const loopN = loopOf();
    document.getElementById('level').textContent = ((level-1)%LEVELS.length+1) + (loopN>0 ? '↻'+loopN : '');
    document.getElementById('ballCnt').textContent = balls.length;
    document.getElementById('queueCnt').textContent = queue;
    document.getElementById('lives').textContent = '♥'.repeat(Math.max(0,lives)) + '♡'.repeat(Math.max(0,3-lives));
  }

  // ---- 输入 ----
  let keys={}, touchActive=false, touchX=0;
  document.addEventListener('keydown',e=>{
    const k=e.key.toLowerCase();
    keys[k]=true;
    if(['arrowleft','arrowright',' '].includes(k)) e.preventDefault();
    if(k===' ' && phase==='play' && queue>0) fireQueue();   // v3-2 空格齐射（桌面）
  });
  document.addEventListener('keyup',e=>{ keys[e.key.toLowerCase()]=false; });
  function movePaddleBy(dx){ paddle.x = Math.max(2, Math.min(W-2-paddle.w, paddle.x+dx)); }
  // v3-2 触控方案：按住=蓄力瞄准（拖动调角度），松手=齐射；待发球为 0 时拖拽=移动挡板
  stage.addEventListener('pointerdown',e=>{
    touchActive=true; touchX=e.clientX;
    const rect=stage.getBoundingClientRect();
    const px=(e.clientX-rect.left)/rect.width*W;
    if(queue>0 && phase==='play'){ charging=true; chargeT=0; aimX=px; updateAim(px); }
  });
  window.addEventListener('pointermove',e=>{
    if(!touchActive) return;
    const rect=stage.getBoundingClientRect();
    const px=(e.clientX-rect.left)/rect.width*W;
    if(charging){
      updateAim(px);   // 按住拖动 = 调整弹道角度
    }else{
      const dx = (e.clientX - touchX) * (W / stage.clientWidth);
      movePaddleBy(dx); touchX = e.clientX;
    }
  });
  window.addEventListener('pointerup',()=>{
    if(charging){ fireQueue(); }
    charging=false; touchActive=false;
  });
  function updateAim(px){
    aimX=px;
    aimAngle = Math.max(-0.9, Math.min(0.9, (px-W/2)/(W/2)*0.9));
  }
  const leftBtn=document.getElementById('leftBtn'), rightBtn=document.getElementById('rightBtn');
  let padL=false, padR=false;
  leftBtn.addEventListener('pointerdown',e=>{e.preventDefault();padL=true;});
  leftBtn.addEventListener('pointerup',()=>padL=false);
  leftBtn.addEventListener('pointerleave',()=>padL=false);
  rightBtn.addEventListener('pointerdown',e=>{e.preventDefault();padR=true;});
  rightBtn.addEventListener('pointerup',()=>padR=false);
  rightBtn.addEventListener('pointerleave',()=>padR=false);

  // ---- v3-2 齐射蓄力发射 ----
  function fireQueue(){
    if(queue<=0 || phase!=='play') return;
    const room = BALL_MAX - balls.length;
    if(room<=0) return;
    const n = Math.min(queue, room);
    const sp = 3.2*levelDef().speedMult;
    const px = paddle.x+paddle.w/2, py = paddle.y;
    for(let i=0;i<n;i++){
      const t = n===1 ? 0 : (i/(n-1)-0.5);
      const a = aimAngle + t*FIRE_SPREAD;
      balls.push(newBall(px+Math.sin(a)*6, py-6, Math.sin(a)*sp, -Math.cos(a)*sp, 4));
    }
    queue -= n;
    S.fire();
    addFloat(W/2, H-70, 'FIRE ×'+n, '#00d4ff', 13);
    updateHud();
  }

  // ---- v3-7 指数分裂强化 ----
  function splitBalls(n){
    const newBalls=[];
    for(const b of balls){
      for(let i=0;i<n;i++){
        const ang = Math.random()*Math.PI*2;
        const sp = Math.hypot(b.vx,b.vy) * (0.85 + Math.random()*0.3);
        const nb = newBall(b.x, b.y, Math.cos(ang)*sp, Math.sin(ang)*sp, Math.max(2.5, b.r*0.9));
        nb.flash = 1;
        newBalls.push(nb);
      }
    }
    // 连吃分裂道具 0.3s 内连续分裂 → 弹幕雪崩加成
    const now = performance.now();
    cascade = (now-lastSplitT)<300 ? Math.min(6,cascade+1) : 1;
    lastSplitT = now;
    const overflow = Math.max(0, newBalls.length - BALL_MAX);   // 超限转分数
    balls = newBalls.slice(0, BALL_MAX);
    if(overflow>0){
      const bonus = overflow*50*cascade;
      score += bonus;
      addFloat(W/2, H/2, '+'+bonus+' OVER!', '#ffd700', 12);
    }
    flash = Math.max(flash, 0.15);                              // 全屏闪光
    shake(6,0.18); vibrate(22);
    addFloat(W/2, H/2-30, 'SPLIT ×'+n, '#00d4ff', 15);
    comboFlash=1.2; comboText='SPLIT ×'+n; comboColor='#00d4ff';
    S.split(); if(cascade>=2) S.triple();
    updateHud();
  }
  function widenPaddle(){
    paddle.w = Math.min(96, paddle.w + 20);
    comboFlash=1.2; comboText='WIDE!'; comboColor='#2cb67d';
    S.power();
  }

  // ---- v3-9 道具磁吸 + 接取仪式 ----
  const DROP_COLORS = { split:'#00d4ff', wide:'#2cb67d', life:'#e53170' };
  const DROP_LABELS = { split:'SPLIT ×2', wide:'WIDE!', life:'+1 ♥' };
  function catchDrop(d){
    if(d.kind==='split') splitBalls(2);
    else if(d.kind==='wide') widenPaddle();
    else if(d.kind==='life'){ lives=Math.min(5, lives+1); S.catch(); comboFlash=1.2; comboText='+1 ♥'; comboColor='#e53170'; }
    // 接取仪式：专属音效 + 光环扩散 + 飘字 + 震动
    rings.push({x:d.x,y:d.y,color:DROP_COLORS[d.kind],t:0,dur:0.35,maxR:22});
    addFloat(d.x, d.y, DROP_LABELS[d.kind], DROP_COLORS[d.kind], 12);
    flash = Math.max(flash, 0.1);
    shake(4,0.12); vibrate(18);
    updateHud();
  }

  // ---- v3-1/v3-3/v3-6/v3-10 砖块命中处理 ----
  function hitBrick(br){
    // 连击音阶阶梯：2s 内连续命中连击+1，音调随连击升
    combo = comboT>0 ? combo+1 : 1;
    comboT = 2;
    S.hit();
    const cx=br.x+br.w/2, cy=br.y+br.h/2;
    const color = BRICK_COLORS[br.row % BRICK_COLORS.length];
    br.hp--;
    if(br.hp<=0){
      // 归零碎裂：得分 + 粒子风暴 + 震动
      br.alive=false;
      const pts = brickPoints(br.row);
      score += pts;
      addFloat(cx, cy, '+'+pts, color, 10);
      burst(cx, cy, color, 8+Math.min(22, balls.length*2));
      S.destroy();
      shake(4,0.12); vibrate(15);
      // v3-10 花式命名：2s 内连碎 ≥3 块 → TRIPLE!
      const now = performance.now();
      destroyedLog.push(now);
      while(destroyedLog.length && now-destroyedLog[0]>2000) destroyedLog.shift();
      if(destroyedLog.length>=3 && now-lastTriple>1500){
        lastTriple=now;
        addFloat(W/2, H/2-50, 'TRIPLE!', '#e53170', 20, 1.0);
        S.triple(); shake(5,0.15); vibrate(20);
      }
      // v3-12 开局 10 秒内必掉道具
      if(Math.random() < DROP_RATE || (!dropGuaranteed && levelT<10)){
        dropGuaranteed = true;
        const kinds = ['split','split','wide','life'];
        const k = kinds[Math.floor(Math.random()*kinds.length)];
        drops.push({x:cx, y:cy, r:5, kind:k, dead:false, t:0});
      }
    }else{
      // 未碎：小额分数飘字
      const pts = 5+combo;
      score += pts;
      addFloat(cx, cy, '+'+pts, '#ffffff', 8);
    }
    // v3-10 花式命名：单球连击 ≥8 → MEGA COMBO!
    if(combo>=8 && !megaShown){
      megaShown=true;
      addFloat(W/2, H/2-70, 'MEGA COMBO!', '#ffd700', 20, 1.0);
      S.mega(); shake(6,0.2); vibrate(25);
    }
    updateHud();
  }

  // v4 矩形反弹（砖块/围墙共用）：从较深一侧推出，防止重复判定
  function bounceOffRect(b, r){
    const cx=r.x+r.w/2, cy=r.y+r.h/2;
    const dx=b.x-cx, dy=b.y-cy;
    if(Math.abs(dx/r.w) > Math.abs(dy/r.h)){
      b.vx = dx>0? Math.abs(b.vx):-Math.abs(b.vx);
      b.x = dx>0 ? r.x+r.w+b.r : r.x-b.r;
    }else{
      b.vy = dy>0? Math.abs(b.vy):-Math.abs(b.vy);
      b.y = dy>0 ? r.y+r.h+b.r : r.y-b.r;
    }
  }

  // ---- 球体更新（sf=速度系数，慢动作时缩小） ----
  function updateBalls(sf){
    for(const b of balls){
      b.trail.push({x:b.x,y:b.y});
      if(b.trail.length>8) b.trail.shift();
      if(b.flash>0) b.flash-=1/60;
      b.x += b.vx*sf; b.y += b.vy*sf;
      if(b.x<b.r){ b.x=b.r; b.vx=Math.abs(b.vx); S.wall(); }
      if(b.x>W-b.r){ b.x=W-b.r; b.vx=-Math.abs(b.vx); S.wall(); }
      if(b.y<b.r){ b.y=b.r; b.vy=Math.abs(b.vy); S.wall(); }

      // 挡板
      if(b.vy>0 && b.y+b.r>=paddle.y && b.y+b.r<=paddle.y+paddle.h+4 &&
         b.x>=paddle.x-2 && b.x<=paddle.x+paddle.w+2){
        const hit = (b.x-(paddle.x+paddle.w/2))/(paddle.w/2);
        const edge = (b.x < paddle.x+8) || (b.x > paddle.x+paddle.w-8);   // v3-10 SAVE 判定
        b.vy = -Math.abs(b.vy);
        b.vx = hit*3.4 + (b.vx>0?.25:-.25);
        b.y = paddle.y-b.r;
        S.paddle();
        if(edge && saveCd<=0){
          saveCd=0.6;
          addFloat(paddle.x+paddle.w/2, paddle.y-14, 'SAVE!', '#ffd700', 12, 0.9);
          S.save(); shake(3,0.1); vibrate(12);
        }
      }

      // 砖块碰撞
      for(const br of bricks){
        if(!br.alive) continue;
        if(b.x+b.r>br.x && b.x-b.r<br.x+br.w && b.y+b.r>br.y && b.y-b.r<br.y+br.h){
          const cx=br.x+br.w/2, cy=br.y+br.h/2;
          const dx=b.x-cx, dy=b.y-cy;
          if(Math.abs(dx/br.w) > Math.abs(dy/br.h)){
            b.vx = dx>0? Math.abs(b.vx):-Math.abs(b.vx);
            b.x = dx>0 ? br.x+br.w+b.r : br.x-b.r;    // 推出砖块防重复判定
          }else{
            b.vy = dy>0? Math.abs(b.vy):-Math.abs(b.vy);
            b.y = dy>0 ? br.y+br.h+b.r : br.y-b.r;
          }
          hitBrick(br);
          break;
        }
      }
      // v4 围墙碰撞：同砖块反弹逻辑，但不可破坏、无粒子/分数/道具
      for(const wl of walls){
        if(b.x+b.r>wl.x && b.x-b.r<wl.x+wl.w && b.y+b.r>wl.y && b.y-b.r<wl.y+wl.h){
          bounceOffRect(b, wl);
          S.wall();
          break;
        }
      }
    }
  }

  // ---- v3-8 清屏慢动作特写 ----
  function startClear(){
    phase='clear';
    clearTimer = 1.25;
    timeScale = 0.3;
    clearBrickPos = bricks.map(b=>({x:b.x+b.w/2, y:b.y+b.h/2}));
    flash = 0.5;
    addFloat(W/2, H/2-20, 'CLEAR!', '#ff8906', 26, 1.0);
    S.clear();
    shake(8,0.3); vibrate(40);
  }

  // ---- v3-13 结算高潮页 ----
  function showSettle(){
    phase='settle';
    // v4 第 15 关通关 → 「全部通关！」终局结算，之后按钮进入循环模式
    const isFinal = (level-1)%LEVELS.length === LEVELS.length-1;
    // 星级：剩余球数 + 生命（终局满星）
    const st = isFinal ? 3 : 1 + (balls.length+queue>=6?1:0) + (lives>=2?1:0);
    document.getElementById('settleTitle').textContent = isFinal ? '🏆 全部通关！' : 'LEVEL CLEAR!';
    document.getElementById('settleTitle').style.color = isFinal ? 'var(--accent)' : 'var(--green)';
    document.getElementById('nextBtn').textContent = isFinal ? '循环模式 ▶' : '下一关 ▶';
    document.getElementById('settleStars').textContent = '★'.repeat(st)+'☆'.repeat(3-st);
    document.getElementById('settleScore').textContent = score;
    settleRoll = {from:0, to:score, t:0, dur:1.1};
    chainQueue = clearBrickPos.map((p,i)=>({x:p.x,y:p.y,delay:0.018*i}));  // 连锁碎裂
    chainT = 0;
    show('settleOverlay');
    S.settle();
    flash = 0.35;
  }
  function nextLevel(){
    level++;
    buildLevel(); resetPaddle();
    if(balls.length===0) resetBalls();
    queue = Math.min(QUEUE_MAX, queue+1);
    levelT=0; dropGuaranteed=false;
    combo=0; comboT=0; megaShown=false;
    phase='play'; timeScale=1;
    hide('settleOverlay');
    updateHud();
  }

  // ---- 主循环 ----
  function loop(t){
    if(!running) return;
    const dt = Math.min(0.033, (t-lastT)/1000);
    lastT = t;
    // v3-4 性能自适应：帧间隔变长时自动降粒子量
    emaDt = emaDt*0.92 + dt*0.08;
    const target = emaDt>0.021 ? Math.max(0.4, 0.021/emaDt) : 1;
    particleScale += (target-particleScale)*0.15;
    update(dt);
    draw();
    animId = requestAnimationFrame(loop);
  }

  function update(dt){
    // v3-8 慢动作 timescale 缓动
    const wantScale = phase==='clear' ? 0.3 : 1;
    timeScale += (wantScale-timeScale)*Math.min(1, 10*dt);
    const dtw = dt*timeScale;

    // 震动 / 闪光衰减
    if(shakeState.t>0) shakeState.t-=dt;
    if(flash>0) flash-=dt*2.2;
    if(saveCd>0) saveCd-=dt;
    // 飘字 / 光环 / 粒子（通用层，任何阶段都更新）
    for(const f of floats){ f.y-=26*dt; f.life-=dt; }
    floats = floats.filter(f=>f.life>0);
    for(const r of rings) r.t+=dt;
    rings = rings.filter(r=>r.t<r.dur);
    for(const p of particles){
      p.vy += 300*dtw; p.vx *= (1-2.2*dtw); p.vy *= (1-1.2*dtw);
      p.x += p.vx*dtw; p.y += p.vy*dtw; p.life -= dtw;
    }
    particles = particles.filter(p=>p.life>0 && p.y<H+30);
    // 连击计时（2s 未命中重置）
    if(comboT>0){
      comboT-=dt;
      if(comboT<=0){ combo=0; megaShown=false; }
    }
    if(comboFlash>0) comboFlash-=dt;
    if(charging && phase==='play' && queue>0) chargeT+=dt;

    if(phase==='play'){
      levelT += dt;
      // 挡板输入
      const sp = 380*dtw;
      if(keys['arrowleft']||keys['a']||padL) movePaddleBy(-sp);
      if(keys['arrowright']||keys['d']||padR) movePaddleBy(sp);

      // 道具下落 + v3-9 磁吸
      for(const d of drops){
        d.y += 95*dtw;
        const pcx = paddle.x+paddle.w/2;
        if(paddle.y-d.y<80 && d.y<paddle.y){      // <80px 磁吸加速
          d.x += (pcx-d.x)*Math.min(1, 7*dt);
          d.y += 26*dt;
        }
        if(d.y+d.r>=paddle.y && d.y-d.r<=paddle.y+paddle.h &&
           d.x>=paddle.x-2 && d.x<=paddle.x+paddle.w+2){
          d.dead=true; catchDrop(d);
        }
      }
      drops = drops.filter(d=>!d.dead && d.y < H+20);

      updateBalls(dtw*60);

      // 落地：落地球回填待发（v3-2），全灭扣命
      if(balls.some(b=>b.y >= H+12)){
        const fell = balls.filter(b=>b.y>=H+12).length;
        balls = balls.filter(b=>b.y < H+12);
        if(balls.length===0){
          lives--;
          updateHud();
          if(lives<=0){
            running=false; charging=false;
            document.getElementById('overScore').textContent = score;
            document.getElementById('overLevel').textContent = (level-1)%LEVELS.length+1;
            show('overOverlay');
            return;
          }else{
            resetBalls();
            queue = Math.min(QUEUE_MAX, queue+3);
            S.lose(); updateHud();
          }
        }else{
          queue = Math.min(QUEUE_MAX, queue+fell);
          addFloat(W/2, H-36, '▸ +'+fell, '#00d4ff', 9);
          S.refill(); updateHud();
        }
      }

      // 过关 → v3-8 清屏慢动作特写
      if(bricks.every(b=>!b.alive)){
        startClear();
      }
    }else if(phase==='clear'){
      clearTimer -= dt;
      updateBalls(dtw*60);                       // 球以慢动作继续飞
      if(clearTimer<=0) showSettle();
    }else if(phase==='settle'){
      // v3-13 连锁碎裂动画
      chainT += dt;
      while(chainQueue.length && chainQueue[0].delay<=chainT){
        const p = chainQueue.shift();
        burst(p.x, p.y, BRICK_COLORS[(Math.random()*BRICK_COLORS.length)|0], 5);
        rings.push({x:p.x,y:p.y,color:'#ffffff',t:0,dur:0.3,maxR:14});
      }
      // 分数滚动
      if(settleRoll){
        settleRoll.t += dt;
        const k = Math.min(1, settleRoll.t/settleRoll.dur);
        document.getElementById('settleScore').textContent =
          Math.round(settleRoll.from + (settleRoll.to-settleRoll.from)*(1-Math.pow(1-k,3)));
      }
    }
  }

  // ---- 绘制 ----
  // v3-1 砖块颜色随 hp 变暗
  function shade(hex,f){
    const n = parseInt(hex.slice(1),16);
    const r=Math.min(255,Math.round(((n>>16)&255)*f));
    const g=Math.min(255,Math.round(((n>>8)&255)*f));
    const b=Math.min(255,Math.round((n&255)*f));
    return `rgb(${r},${g},${b})`;
  }
  function drawBrick(b){
    const bright = b.hp>=3 ? 1 : b.hp===2 ? 0.72 : 0.5;   // v4 hp 最高 4
    ctx.fillStyle = shade(BRICK_COLORS[b.row % BRICK_COLORS.length], bright);
    ctx.fillRect(b.x+1, b.y+1, b.w-2, b.h-2);
    ctx.fillStyle = 'rgba(255,255,255,.25)';
    ctx.fillRect(b.x+1, b.y+1, b.w-2, 3);
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    ctx.fillRect(b.x+1, b.y+b.h-3, b.w-2, 2);
    // 血量数字（v4 密砖下字号随砖宽自适应）
    pxText(b.hp, b.x+b.w/2, b.y+b.h/2+0.5, Math.max(6, Math.min(9, b.w-6)), '#ffffff');
  }
  // v4 围墙绘制：钢铁质感（深灰底 + 亮高光边 + 铆钉点），与彩色砖块明显区分
  function drawWall(w){
    ctx.fillStyle = '#4a4a5a';
    ctx.fillRect(w.x, w.y, w.w, w.h);
    ctx.fillStyle = '#8a8aa0';
    ctx.fillRect(w.x, w.y, w.w, 2);
    ctx.fillRect(w.x, w.y, 2, w.h);
    ctx.fillStyle = '#23232f';
    ctx.fillRect(w.x, w.y+w.h-2, w.w, 2);
    ctx.fillRect(w.x+w.w-2, w.y, 2, w.h);
    ctx.fillStyle = 'rgba(255,255,255,.22)';
    ctx.fillRect(w.x+w.w/2-1, w.y+w.h/2-1, 2, 2);
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    ctx.save();
    // v3-5 屏幕震动：canvas 整体位移
    if(shakeState.t>0){
      const m = shakeState.mag*(shakeState.t/shakeState.dur);
      ctx.translate((Math.random()*2-1)*m, (Math.random()*2-1)*m);
    }
    ctx.fillStyle='#14132a'; ctx.fillRect(-10,-10,W+20,H+20);
    // 星空
    ctx.fillStyle='rgba(255,255,255,.14)';
    for(let i=0;i<40;i++){
      const sx=(i*67)%W, sy=(i*53)%H, sr=(i%3===0)?1:0.5;
      ctx.fillRect(sx, sy, sr, sr);
    }
    // 砖块
    for(const b of bricks) if(b.alive) drawBrick(b);
    // v4 围墙（绘制在砖块上层）
    for(const w of walls) drawWall(w);
    // 道具
    for(const d of drops){
      d.t+=0.1;
      const bob = Math.sin(d.t*3)*1.5;
      const yy = d.y+bob;
      ctx.fillStyle = DROP_COLORS[d.kind];
      ctx.fillRect(d.x-5, yy-5, 10, 10);
      ctx.fillStyle='#fff';
      ctx.fillRect(d.x-1, yy-1, 2, 2);
      ctx.fillStyle='rgba(255,255,255,.2)';
      ctx.fillRect(d.x-7, yy-7, 14, 14);
    }
    // 挡板
    ctx.fillStyle = '#fffffe';
    ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);
    ctx.fillStyle = '#ff8906';
    ctx.fillRect(paddle.x, paddle.y, paddle.w, 2);
    // 球（带拖尾 + 分裂闪光）
    for(const b of balls){
      for(let i=0;i<b.trail.length;i++){
        const tr = b.trail[i];
        const a = 0.25*(i+1)/b.trail.length;
        ctx.fillStyle = `rgba(255,137,6,${a})`;
        ctx.fillRect(tr.x-3, tr.y-3, 6, 6);
      }
      ctx.fillStyle = b.flash>0 ? '#00d4ff' : '#ff8906';
      ctx.fillRect(b.x-4, b.y-4, 8, 8);
      ctx.fillStyle = 'rgba(255,255,255,.7)';
      ctx.fillRect(b.x-2, b.y-2, 3, 3);
    }
    // v3-4 粒子
    for(const p of particles){
      const a = Math.max(0, p.life/p.maxLife);
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x-p.size/2, p.y-p.size/2, p.size, p.size);
      ctx.globalAlpha = 1;
    }
    // v3-9 接取光环
    for(const r of rings){
      const k = Math.min(1, r.t/r.dur);
      ctx.strokeStyle = r.color;
      ctx.globalAlpha = 0.8*(1-k);
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(r.x, r.y, 4+r.maxR*k, 0, Math.PI*2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
    // v3-2 蓄力弹道虚线预览（按住时）
    if(charging && phase==='play' && queue>0){
      const px = paddle.x+paddle.w/2, py = paddle.y;
      const pulse = 0.35 + 0.4*Math.min(1, chargeT/0.5);
      ctx.save();
      ctx.setLineDash([4,4]);
      ctx.lineWidth = 2;
      ctx.strokeStyle = `rgba(0,212,255,${pulse})`;
      ctx.beginPath(); ctx.moveTo(px,py);
      ctx.lineTo(px+Math.sin(aimAngle)*py, py-Math.cos(aimAngle)*py);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,.25)';
      for(const da of [-FIRE_SPREAD/2, FIRE_SPREAD/2]){
        ctx.beginPath(); ctx.moveTo(px,py);
        ctx.lineTo(px+Math.sin(aimAngle+da)*py, py-Math.cos(aimAngle+da)*py);
        ctx.stroke();
      }
      ctx.restore();
    }
    // v3-6 飘字
    for(const f of floats){
      const a = Math.max(0, f.life/f.maxLife);
      ctx.globalAlpha = a;
      pxText(f.text, f.x, f.y, f.size, f.color);
      ctx.globalAlpha = 1;
    }
    ctx.restore();

    // v3-7 全屏闪光（不受震动影响）
    if(flash>0){
      ctx.fillStyle = `rgba(255,255,255,${Math.min(1,flash)})`;
      ctx.fillRect(0,0,W,H);
    }
    // 顶部标题
    pxText('找到第一个球', W/2, 14, 9, '#7f5af0');
    // v3-3 连击显示
    if(combo>=2 && comboT>0){
      pxText('COMBO ×'+combo, W/2, 26, 10, NOTE_COLORS[(combo-1)%8]);
    }
    // v3-2 待发球指示（左下角点阵）
    if(queue>0 && phase==='play'){
      for(let i=0;i<queue;i++){
        ctx.fillStyle='#00d4ff';
        ctx.fillRect(8+i*9, H-12, 5, 5);
        ctx.fillStyle='rgba(255,255,255,.5)';
        ctx.fillRect(8+i*9, H-12, 2, 2);
      }
    }
    // combo 闪字
    if(comboFlash>0){
      const a = Math.min(1, comboFlash);
      ctx.globalAlpha = a;
      pxText(comboText, W/2, H/2-40, 14, comboColor);
      ctx.globalAlpha = 1;
    }
  }

  // ---- overlay ----
  function $(id){ return document.getElementById(id); }
  function show(id){ $(id).classList.remove('hidden'); }
  function hide(id){ $(id).classList.add('hidden'); }

  $('startBtn').onclick = () => { hide('startOverlay'); startGame(); };
  $('againBtn').onclick = () => { hide('winOverlay'); startGame(); };
  $('retryBtn').onclick = () => { hide('overOverlay'); startGame(); };
  $('nextBtn').onclick = () => { nextLevel(); };

  // ---- v4 调试接口（供自动化验证 / 截图使用）----
  window.__pb = {
    start: startGame,
    setLevel(n){ level=Math.max(1,Math.min(LEVELS.length,n|0)); buildLevel(); resetPaddle(); resetBalls(); drops=[]; queue=levelDef().queue; phase='play'; timeScale=1; charging=false; hide('startOverlay'); hide('settleOverlay'); hide('overOverlay'); hide('winOverlay'); updateHud(); },
    defs: LEVELS,
    get level(){ return level; },
    get bricks(){ return bricks.length; },
    get walls(){ return walls.length; },
    get grid(){ return {cols:curCols, rows:curRows, left:curLeft, bw:curBW, gap:curGap, top:BRICK_TOP, bh:BRICK_H}; },
    get bricksAll(){ return bricks; },
    get wallsAll(){ return walls; },
    fire: fireQueue
  };

  // v4 自动化支持：URL ?level=5&mute=1 直接进入指定关卡并静音（headless 截图验证用）
  (() => {
    const qs = new URLSearchParams(location.search);
    if(qs.get('mute')==='1'){ muted=true; muteBtn.textContent='🔇'; }
    const n = parseInt(qs.get('level')||'0',10);
    if(n>0){ hide('startOverlay'); startGame(); window.__pb.setLevel(n); }
  })();

  // 首帧预览
  buildLevel(); resetPaddle(); resetBalls();
  draw();
})();
</script>
</body>
